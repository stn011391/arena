<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Arena v4 — Real Walk-Forward</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eaf2ff;font-family:system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:1300px;margin:auto;padding:24px}.hero,.panel{background:#0d1a27;border:1px solid #20384c;border-radius:18px;padding:22px;margin-bottom:14px}.hero{background:radial-gradient(circle at 80% 0,#16485a,#0b1722 58%)}h1{font-size:44px;margin:5px 0}.ey{color:#5ee4ff;font-size:12px;letter-spacing:.15em}.sub,.note{color:#94a9bb}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bot{background:#101f2d;border:1px solid #29465b;border-radius:14px;padding:14px}.score{font-size:25px;font-weight:900;margin:8px 0}.green{color:#62e39b}.red{color:#ff7882}.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#17372f;color:#72e8bd;font-size:11px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 4px}.run{font-size:18px;font-weight:900;background:#117b61;color:white;border:1px solid #36d7aa;border-radius:12px;padding:14px 22px;cursor:pointer}.console{background:#050b10;border:1px solid #29465b;border-radius:12px;padding:14px;font-family:ui-monospace,monospace;white-space:pre-line;color:#9ed7b8}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric div{background:#0a1722;padding:12px;border-radius:10px}.metric b{display:block;font-size:20px}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #203344;text-align:right}th:first-child,td:first-child{text-align:left}.tabs button{background:#132b3e;color:#fff;border:1px solid #2b506a;border-radius:8px;padding:8px;margin:3px;cursor:pointer}@media(max-width:900px){.grid,.metric{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div class="ey">TAIWAN STOCK AI COMPETITION · v4</div><h1>🏟️ STOCK ARENA</h1><p class="sub">REAL 3-YEAR WALK-FORWARD · NT$1,000,000 / ROBOT · MAX 5 HOLDINGS · NO SYNTHETIC PRICES</p><div class="actions"><button class="run" id="load">▶ SHOW 3-YEAR RESULTS</button><span class="badge" id="status">LOADING</span></div><div id="console" class="console">正在讀取 GitHub Actions 產生的真實回測結果…</div></section><section class="panel"><div class="ey">CHAMPIONSHIP</div><h2>🏆 三年排行榜</h2><div class="grid" id="leader"></div></section><section class="panel"><div class="ey">ROBOT SCORECARD</div><h2 id="robotTitle">📊 點選 Robot 查看</h2><div class="metric" id="metrics"></div></section><section class="panel"><div class="ey">AUDIT TRAIL</div><h2>📒 Complete Trade Ledger</h2><div class="tabs" id="tabs"></div><div class="table"><table><thead><tr><th>股票</th><th>買進</th><th>賣出</th><th>買價</th><th>賣價</th><th>數量</th><th>P&amp;L</th><th>報酬</th><th>天數</th></tr></thead><tbody id="ledger"></tbody></table></div></section></div><script>let DATA=null;const $=s=>document.querySelector(s);function money(x){return Number(x).toLocaleString('zh-TW')}async function load(){try{$('#status').textContent='LOADING REAL RESULTS';let r=await fetch('data/backtest_results.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('尚未產生 backtest_results.json');let d=await r.json();if(d.synthetic!==false)throw Error('資料未通過 real-data guard');DATA=d;$('#status').textContent='REAL BACKTEST READY';$('#console').textContent=`[OK] 真實市場資料已驗證\n[PERIOD] ${d.start} → ${d.end}\n[CAPITAL] NT$${money(d.initial_capital_per_robot)} / Robot\n[RULE] Walk-forward / no look-ahead / max ${d.max_positions} holdings`;render();show(0)}catch(e){$('#status').textContent='BACKTEST NOT READY';$('#console').textContent='[WAIT] '+e.message+'\nGitHub Actions 正在/需要執行 Real 3-Year Stock Arena Backtest。頁面不會產生假績效。'}}function render(){$('#leader').innerHTML=DATA.robots.map((x,i)=>`<div class="bot" onclick="show(${i})"><small>#${i+1}</small><h3>${x.name}</h3><div class="score ${x.total_return>=0?'green':'red'}">${x.total_return>=0?'+':''}${x.total_return}%</div><b>NT$${money(x.final_equity)}</b><p class="note">Win ${x.win_rate}% · ${x.trades} trades</p></div>`).join('');$('#tabs').innerHTML=DATA.robots.map((x,i)=>`<button onclick="show(${i})">${x.name}</button>`).join('')}function show(i){let x=DATA.robots[i];$('#robotTitle').textContent='📊 '+x.name;$('#metrics').innerHTML=`<div><small>Final Equity</small><b>NT$${money(x.final_equity)}</b></div><div><small>Total Return</small><b>${x.total_return}%</b></div><div><small>Win Rate</small><b>${x.win_rate}%</b></div><div><small>CAGR</small><b>${x.cagr}%</b></div><div><small>Max Drawdown</small><b>${x.max_drawdown}%</b></div><div><small>Sharpe</small><b>${x.sharpe}</b></div><div><small>Profit Factor</small><b>${x.profit_factor??'∞'}</b></div><div><small>Completed Trades</small><b>${x.trades}</b></div>`;$('#ledger').innerHTML=x.ledger.slice().reverse().map(t=>`<tr><td>${t.symbol}</td><td>${t.entry}</td><td>${t.exit}</td><td>${t.entry_price}</td><td>${t.exit_price}</td><td>${t.qty}</td><td class="${t.pnl>=0?'green':'red'}">${money(t.pnl)}</td><td>${t.return_pct}%</td><td>${t.days}</td></tr>`).join('')}$('#load').onclick=load;load();</script></body></html>
