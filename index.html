<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Arena v4.1 — T+1 Results</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eaf2ff;font-family:system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:1300px;margin:auto;padding:24px}.hero,.panel{background:#0d1a27;border:1px solid #20384c;border-radius:18px;padding:22px;margin-bottom:14px}.hero{background:radial-gradient(circle at 80% 0,#16485a,#0b1722 58%)}h1{font-size:44px;margin:5px 0}.ey{color:#5ee4ff;font-size:12px;letter-spacing:.15em}.sub,.note{color:#94a9bb}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bot{background:#101f2d;border:1px solid #29465b;border-radius:14px;padding:14px;cursor:pointer}.bot:hover{border-color:#5ee4ff}.score{font-size:25px;font-weight:900;margin:8px 0}.green{color:#62e39b}.red{color:#ff7882}.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#17372f;color:#72e8bd;font-size:11px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 4px}.run{font-size:18px;font-weight:900;background:#117b61;color:white;border:1px solid #36d7aa;border-radius:12px;padding:14px 22px;cursor:pointer}.console{background:#050b10;border:1px solid #29465b;border-radius:12px;padding:14px;font-family:ui-monospace,monospace;white-space:pre-line;color:#9ed7b8}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric div{background:#0a1722;padding:12px;border-radius:10px}.metric b{display:block;font-size:20px}.table{overflow:auto;max-height:650px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #203344;text-align:right}th:first-child,td:first-child{text-align:left}.tabs button{background:#132b3e;color:#fff;border:1px solid #2b506a;border-radius:8px;padding:8px;margin:3px;cursor:pointer}@media(max-width:900px){.grid,.metric{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div class="ey">TAIWAN STOCK AI COMPETITION · v4.1</div><h1>🏟️ STOCK ARENA</h1><p class="sub">T CLOSE SIGNAL → T+1 OPEN EXECUTION · NT$1,000,000 / ROBOT · MAX 5 HOLDINGS</p><div class="actions"><button class="run" id="load">↻ RELOAD RESULTS</button><span class="badge" id="status">LOADING</span></div><div id="console" class="console">正在讀取真實 T+1 回測結果…</div></section><section class="panel"><div class="ey">CHAMPIONSHIP</div><h2>🏆 三年排行榜</h2><div class="grid" id="leader"><p class="note">Loading…</p></div></section><section class="panel"><div class="ey">ROBOT SCORECARD</div><h2 id="robotTitle">📊 Robot Scorecard</h2><div class="metric" id="metrics"></div></section><section class="panel"><div class="ey">AUDIT TRAIL</div><h2>📒 Complete Trade Ledger</h2><div class="tabs" id="tabs"></div><div class="table"><table><thead><tr><th>股票</th><th>訊號日</th><th>買進 T+1</th><th>賣出訊號</th><th>賣出 T+1</th><th>買價</th><th>賣價</th><th>P&amp;L</th><th>報酬</th></tr></thead><tbody id="ledger"></tbody></table></div></section></div><script>var DATA=null;function el(id){return document.getElementById(id)}function money(x){return Number(x).toLocaleString('zh-TW')}function resultURL(){var base=location.pathname.endsWith('/')?location.pathname:location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);return location.origin+base+'data/backtest_results.json?v='+Date.now()}async function loadResults(){el('status').textContent='LOADING';try{var r=await fetch(resultURL(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);var d=await r.json();if(!d||d.synthetic!==false||!Array.isArray(d.robots))throw new Error('Invalid result data');DATA=d;el('status').textContent='REAL T+1 READY';el('console').textContent='[OK] REAL DATA\n[PERIOD] '+d.start+' → '+d.end+'\n[SIGNAL] '+(d.signal_timing||'T close')+'\n[EXECUTION] '+(d.execution_timing||'T+1 open')+'\n[CAPITAL] NT$'+money(d.initial_capital_per_robot)+' / Robot';renderLeaderboard();showRobot(0)}catch(e){el('status').textContent='LOAD ERROR';el('console').textContent='[ERROR] '+e.message+'\nURL: '+resultURL()+'\n請重新整理；若仍失敗代表 GitHub Pages 尚未部署最新 data 檔。'}}function renderLeaderboard(){el('leader').innerHTML=DATA.robots.map(function(x,i){return '<div class="bot" data-i="'+i+'"><small>#'+(i+1)+'</small><h3>'+x.name+'</h3><div class="score '+(x.total_return>=0?'green':'red')+'">'+(x.total_return>=0?'+':'')+x.total_return+'%</div><b>NT$'+money(x.final_equity)+'</b><p class="note">Win '+x.win_rate+'% · '+x.trades+' trades</p></div>'}).join('');Array.from(el('leader').querySelectorAll('.bot')).forEach(function(n){n.onclick=function(){showRobot(Number(n.dataset.i))}});el('tabs').innerHTML=DATA.robots.map(function(x,i){return '<button data-i="'+i+'">'+x.name+'</button>'}).join('');Array.from(el('tabs').querySelectorAll('button')).forEach(function(n){n.onclick=function(){showRobot(Number(n.dataset.i))}})}function showRobot(i){var x=DATA.robots[i];el('robotTitle').textContent='📊 '+x.name;el('metrics').innerHTML='<div><small>Final Equity</small><b>NT$'+money(x.final_equity)+'</b></div><div><small>Total Return</small><b>'+x.total_return+'%</b></div><div><small>Win Rate</small><b>'+x.win_rate+'%</b></div><div><small>CAGR</small><b>'+x.cagr+'%</b></div><div><small>Max Drawdown</small><b>'+x.max_drawdown+'%</b></div><div><small>Sharpe</small><b>'+x.sharpe+'</b></div><div><small>Profit Factor</small><b>'+(x.profit_factor==null?'∞':x.profit_factor)+'</b></div><div><small>Completed Trades</small><b>'+x.trades+'</b></div>';el('ledger').innerHTML=(x.ledger||[]).slice().reverse().map(function(t){return '<tr><td>'+t.symbol+'</td><td>'+(t.signal_entry||'—')+'</td><td>'+t.entry+'</td><td>'+(t.signal_exit||'—')+'</td><td>'+t.exit+'</td><td>'+t.entry_price+'</td><td>'+t.exit_price+'</td><td class="'+(t.pnl>=0?'green':'red')+'">'+money(t.pnl)+'</td><td>'+t.return_pct+'%</td></tr>'}).join('')}el('load').onclick=loadResults;window.addEventListener('load',loadResults);</script></body></html>
