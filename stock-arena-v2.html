<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Arena v2</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eaf2ff;font-family:system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.hero,.panel{background:#0d1a27;border:1px solid #20384c;border-radius:18px;padding:22px;margin-bottom:14px}.hero{background:radial-gradient(circle at 80% 0,#153f51,#0b1722 55%)}h1{font-size:44px;margin:5px 0}.ey{color:#5ee4ff;font-size:12px;letter-spacing:.15em}.sub{color:#94a9bb}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bot{background:#101f2d;border:1px solid #29465b;border-radius:14px;padding:14px}.bot b{font-size:18px}.score{font-size:27px;font-weight:900;margin:8px 0}.green{color:#62e39b}.red{color:#ff6b78}.lock{display:inline-block;background:#243546;border-radius:8px;padding:6px 9px;font-size:11px}.pick{display:grid;grid-template-columns:50px 1fr 85px 80px;gap:8px;padding:10px 0;border-bottom:1px solid #203344}.consensus{background:#16281f;border:1px solid #356748}.meter{height:7px;background:#182b39;border-radius:9px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:#55d9f5}.actions{display:flex;gap:8px;flex-wrap:wrap}button{background:#153047;border:1px solid #2d5974;color:#fff;padding:11px 15px;border-radius:10px;font-weight:800;cursor:pointer}button:hover{border-color:#63ddff}.tabs{display:flex;gap:8px;margin:14px 0}.note{font-size:12px;color:#8ea4b6}@media(max-width:900px){.grid{grid-template-columns:1fr}.pick{grid-template-columns:40px 1fr 70px}}</style></head><body><div class="wrap"><section class="hero"><div class="ey">TAIWAN STOCK AI COMPETITION · PROTOTYPE v2</div><h1>🏟️ STOCK ARENA</h1><p class="sub">5 AI · NT$5,000,000 · ONE MARKET · NO EXCUSES</p><div class="actions"><button onclick="runDay()">⚔️ RUN TODAY'S BATTLE</button><button onclick="lockPicks()">🔒 LOCK PICKS</button><button onclick="evolve()">🧬 STRATEGY EVOLUTION</button></div><p class="note">Prototype：目前用示範候選資料驗證競賽 UX；真實行情接入後才會標示 LIVE。</p></section><section class="panel"><div class="ey">CHAMPIONSHIP</div><h2>🏆 Robot Leaderboard</h2><div class="grid" id="leader"></div></section><section class="panel"><div class="ey">TODAY'S WAR ROOM</div><h2>⚔️ 今日決策室 <span class="lock" id="lockState">UNLOCKED</span></h2><div class="grid" id="bots"></div></section><section class="panel consensus"><div class="ey">CROSS-STRATEGY SIGNAL</div><h2>🔥 AI Consensus</h2><div id="consensus"></div></section><section class="panel"><div class="ey">AUDIT TRAIL</div><h2>📒 Prediction Ledger</h2><div id="ledger"></div></section></div><script>const stocks=[['2330','台積電'],['2454','聯發科'],['2317','鴻海'],['2382','廣達'],['3231','緯創'],['2308','台達電'],['3017','奇鋐'],['3324','雙鴻'],['2345','智邦'],['2376','技嘉'],['3034','聯詠'],['6669','緯穎']];const bots=[['🚀','Momentum Hunter','強勢趨勢'],['⚡','Breakout Sniper','突破爆量'],['😈','Reversal Hunter','超跌反轉'],['🧠','Quant Master','多因子'],['🛡️','Risk Master','低回撤']].map((x,i)=>({icon:x[0],name:x[1],dna:x[2],capital:1000000*(1+[.2948,.2413,.182,.3824,.216][i]),ver:'v1.0',picks:[]}));let locked=false,ledger=[];function rnd(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}function runDay(){if(locked)return alert('今日 Picks 已鎖定，不能事後修改。');bots.forEach((b,bi)=>{b.picks=stocks.map((s,si)=>{let base=rnd((bi+1)*997+(si+3)*131+new Date().getDate());let bias=bi===0?(si<7?.12:0):bi===1?(si%3===0?.14:0):bi===2?(si>5?.1:0):bi===3?.1:bi===4?(si<5?.08:0);return{code:s[0],name:s[1],score:Math.min(99,Math.round(58+(base+bias)*38)),why:[b.dna,'Trend','Volume','Risk'][Math.floor(base*4)]}}).sort((a,b)=>b.score-a.score).slice(0,5)});render()}function lockPicks(){if(!bots[0].picks.length)return alert('請先 RUN TODAY’S BATTLE');locked=true;let d=new Date().toLocaleString('zh-TW',{hour12:false});ledger.unshift({date:d,rows:bots.map(b=>({name:b.name,picks:b.picks.map(p=>p.code)}))});render()}function evolve(){bots.forEach(b=>{let n=+(b.ver.split('.')[1]||0)+1;b.ver='v1.'+n});alert('新策略版本只影響未來決策；既有 Ledger 不回寫。');render()}function render(){document.querySelector('#lockState').textContent=locked?'🔒 DECISION LOCKED':'UNLOCKED';document.querySelector('#leader').innerHTML=[...bots].sort((a,b)=>b.capital-a.capital).map((b,i)=>`<div class="bot"><small>#${i+1}</small><br><b>${b.icon} ${b.name}</b><div class="score green">$${Math.round(b.capital).toLocaleString()}</div><small>${((b.capital/1e6-1)*100).toFixed(2)}% · ${b.ver}</small></div>`).join('');document.querySelector('#bots').innerHTML=bots.map(b=>`<div class="bot"><b>${b.icon} ${b.name}</b><p class="note">${b.dna} · ${b.ver}</p>${b.picks.length?b.picks.map((p,i)=>`<div class="pick"><b>#${i+1}</b><span>${p.code} ${p.name}<small style="display:block">WHY: ${p.why}</small></span><strong>${p.score}/100</strong><span>${locked?'🔒':'WATCH'}</span></div>`).join(''):'<p class="note">等待今日決策...</p>'}</div>`).join('');let count={};bots.forEach(b=>b.picks.forEach(p=>count[p.code]=(count[p.code]||0)+1));let top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,5);document.querySelector('#consensus').innerHTML=top.length?top.map(([c,n])=>{let s=stocks.find(x=>x[0]===c);return`<div class="pick"><b>${n}/5</b><span><strong>${c} ${s[1]}</strong><small style="display:block">${n>=4?'🔥 HIGH CONVICTION':'Multi-bot overlap'}</small></span><strong>${Math.round(n/5*100)}/100</strong><div class="meter"><i style="width:${n/5*100}%"></i></div></div>`}).join(''):'<p>執行今日競賽後產生 Consensus。</p>';document.querySelector('#ledger').innerHTML=ledger.length?ledger.map(l=>`<div class="bot"><b>${l.date}</b>${l.rows.map(r=>`<p>${r.name}: ${r.picks.join(' / ')}</p>`).join('')}</div>`).join(''):'<p class="note">尚無鎖定紀錄。</p>'}runDay();render();</script></body></html>
