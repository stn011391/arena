name: Real 3-Year Stock Arena Backtest
on:
  push:
    branches: [main]
    paths:
      - 'scripts/run_backtest.py'
      - 'requirements.txt'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'
concurrency:
  group: stock-arena-backtest-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download real Taiwan market data and evolve strategy until >70% win rate
        run: python scripts/run_backtest.py
      - name: Commit verified results
        run: |
          git config user.name "stock-arena-bot"
          git config user.email "stock-arena-bot@users.noreply.github.com"
          git add -- data/backtest_results.json data/ohlcv/manifest.json
          git diff --cached --quiet || git commit -m "data: refresh real 3-year walk-forward results"
          git push
